<title>SAT Trainer</title>
<meta name="description" content="Интерактивный тренажёр из PDF-экспорта College Board Question Bank с ассистентом Claude.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
  // an explicit choice made in the app; otherwise Claude's theme (or the system one) applies
  try {
    var t = localStorage.getItem("sat-trainer:theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<div id="app"></div>
